name: "Server — Manage MinIO S3 Credentials"

# ═══════════════════════════════════════════════════════════════════════════════
# Madeena Standard CI/CD — MinIO S3 Credentials Administration (CRD)
#
# This workflow allows secure management of MinIO Service Accounts (keys/secrets)
# directly from the GitHub Actions UI.
#
# RUNNER: Must run on 'self-hosted' (targets the production server directly).
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select action to execute'
        type: choice
        required: true
        default: 'read'
        options:
          - 'create'
          - 'read'
          - 'delete'
      project_name:
        description: 'Project/Repository name (required for create; optional filter for read)'
        type: string
        required: false
        default: ''
      suffix:
        description: 'Optional custom suffix for create (e.g. dev, prod, backup; if empty, random 4-char string is used)'
        type: string
        required: false
        default: ''
      bucket_access_type:
        description: 'Target Bucket Access Scope (used for create)'
        type: choice
        required: true
        default: 'project-specific'
        options:
          - 'project-specific'
          - 'project-wildcard'
          - 'all-buckets'
      access_key:
        description: 'Specific Access Key to query or delete (required for delete and specific read)'
        type: string
        required: false
        default: ''
      path_prefix:
        description: 'Folder Prefix Constraint (optional for create, restricts access to a folder under the project bucket)'
        type: string
        required: false
        default: ''
      custom_policy_json:
        description: 'Custom S3 IAM Policy JSON (optional for create, overrides prefix policy if provided)'
        type: string
        required: false
        default: ''

concurrency:
  group: manage-minio-credentials
  cancel-in-progress: false

jobs:
  manage_credentials:
    name: Execute S3 Credentials Administration
    runs-on: [self-hosted, linux, x64, production]
    permissions:
      contents: read
      actions: write
    outputs:
      credential_artifact_id: ${{ steps.upload-creds.outputs.artifact-id }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Manage MinIO S3 Service Account
        id: manage
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
          INPUT_ACTION: ${{ github.event.inputs.action }}
          INPUT_PROJECT_NAME: ${{ github.event.inputs.project_name }}
          INPUT_SUFFIX: ${{ github.event.inputs.suffix }}
          INPUT_ACCESS_KEY: ${{ github.event.inputs.access_key }}
          INPUT_PATH_PREFIX: ${{ github.event.inputs.path_prefix }}
          INPUT_CUSTOM_POLICY_JSON: ${{ github.event.inputs.custom_policy_json }}
          INPUT_BUCKET_ACCESS_TYPE: ${{ github.event.inputs.bucket_access_type }}
        run: |
          set -euo pipefail

          # ── Setup MinIO Client (mc) Alias ────────────────────────────────────
          echo "===> [1/4] Verifying local MinIO API connectivity..."
          if timeout 3 bash -c "</dev/tcp/127.0.0.1/9000" 2>/dev/null; then
            echo "  ✅ PASS: MinIO API is listening locally on port 9000."
          else
            echo "  ❌ FAIL: MinIO is not running or port 9000 is not reachable!"
            exit 1
          fi

          _sudo() {
            if [ -n "${SUDO_PASSWORD:-}" ]; then
              echo "$SUDO_PASSWORD" | sudo -S "$@" 2>/dev/null
            else
              sudo "$@"
            fi
          }

          # Locate mc binary dynamically on the runner or install it if missing
          MC_BIN="mc"
          if command -v mc >/dev/null 2>&1; then
            MC_BIN="mc"
          elif [ -f "/usr/local/bin/mc" ]; then
            MC_BIN="/usr/local/bin/mc"
          elif [ -f "/usr/bin/mc" ]; then
            MC_BIN="/usr/bin/mc"
          elif [ -f "/home/madeena/bin/mc" ]; then
            MC_BIN="/home/madeena/bin/mc"
          elif [ -f "$HOME/.local/bin/mc" ]; then
            MC_BIN="$HOME/.local/bin/mc"
          else
            echo "  ℹ️ MinIO Client (mc) not found on runner. Automatically downloading..."
            curl -sSL -o mc https://dl.min.io/client/mc/release/linux-amd64/mc
            chmod +x mc
            if [ -n "${SUDO_PASSWORD:-}" ] || [ "$(id -u)" -eq 0 ]; then
              _sudo mv mc /usr/local/bin/mc
              MC_BIN="/usr/local/bin/mc"
              echo "  ✅ Installed mc permanently to /usr/local/bin/mc"
            else
              mkdir -p "$HOME/.local/bin"
              mv mc "$HOME/.local/bin/mc"
              MC_BIN="$HOME/.local/bin/mc"
              echo "  ✅ Installed mc locally to $MC_BIN"
            fi
          fi
          echo "  Using mc binary at: $MC_BIN"

          MINIO_USER="${MINIO_ROOT_USER:-minioadmin}"
          MINIO_PASS="${MINIO_ROOT_PASSWORD:-minioadmin}"

          echo "Configuring mc alias..."
          "$MC_BIN" alias set prod http://127.0.0.1:9000 "$MINIO_USER" "$MINIO_PASS" > /dev/null < /dev/null
          echo "  ✅ Alias 'prod' configured."

          # ── Strict Input Sanitization & Validation ───────────────────────────
          echo "===> [2/4] Validating input parameters..."
          
          # Sanitize project name (lowercase letters, numbers, hyphens, and underscores)
          # Limit project identifier to 8 characters for access key generation (limit is 20 chars total)
          SAN_PROJECT_FULL=""
          SAN_PROJECT=""
          if [ -n "$INPUT_PROJECT_NAME" ]; then
            SAN_PROJECT_FULL=$(echo "$INPUT_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-_')
            if [ -z "$SAN_PROJECT_FULL" ]; then
              echo "❌ FATAL: project_name became empty or invalid after sanitization!"
              exit 1
            fi
            SAN_PROJECT=$(echo "$SAN_PROJECT_FULL" | cut -c 1-8)
            echo "  Sanitized project name (full): $SAN_PROJECT_FULL"
            echo "  Sanitized project prefix (truncated): $SAN_PROJECT"
          fi

          # Sanitize suffix (limit to 4 characters)
          SAN_SUFFIX=""
          if [ -n "$INPUT_SUFFIX" ]; then
            SAN_SUFFIX=$(echo "$INPUT_SUFFIX" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-_' | cut -c 1-4)
            if [ -z "$SAN_SUFFIX" ]; then
              echo "❌ FATAL: suffix became empty or invalid after sanitization!"
              exit 1
            fi
            echo "  Sanitized custom suffix (truncated): $SAN_SUFFIX"
          fi

          # Validate custom policy JSON if provided
          if [ -n "$INPUT_CUSTOM_POLICY_JSON" ]; then
            if ! echo "$INPUT_CUSTOM_POLICY_JSON" | python3 -m json.tool >/dev/null 2>&1; then
              echo "❌ FATAL: Invalid JSON format provided for custom_policy_json!"
              exit 1
            fi
            echo "  ✅ Custom policy JSON verified as valid JSON format."
          fi

          # Validate access key format if provided (placing '-' at the end of bracket expression)
          if [ -n "$INPUT_ACCESS_KEY" ]; then
            if [[ ! "$INPUT_ACCESS_KEY" =~ ^[a-z0-9_-]+$ ]]; then
              echo "❌ FATAL: Invalid access_key format! Only lowercase alphanumeric, '-' and '_' are allowed."
              exit 1
            fi
          fi

          echo "================================================================"
          echo "         MINIO S3 CREDENTIALS ADMINISTRATION REPORT             "
          echo "================================================================"
          echo "  Action:             $INPUT_ACTION"
          if [ "$INPUT_ACTION" = "create" ]; then
            echo "  Project Name:       ${INPUT_PROJECT_NAME:-N/A}"
            echo "  Suffix:             ${INPUT_SUFFIX:-[auto-generated if creating]}"
            echo "  Access Key:         ${INPUT_ACCESS_KEY:-[auto-generated if creating]}"
            echo "  Path Prefix:        ${INPUT_PATH_PREFIX:-[None]}"
            echo "  Bucket Access Type: ${INPUT_BUCKET_ACCESS_TYPE:-project-specific}"
          else
            echo "  Access Key:         ${INPUT_ACCESS_KEY:-N/A}"
            if [ -n "$INPUT_PROJECT_NAME" ]; then
              echo "  Project Filter:     $INPUT_PROJECT_NAME"
            fi
          fi
          echo "================================================================"

          # ── Execute Request ──────────────────────────────────────────────────
          echo "===> [3/4] Executing administrative action..."

          BUCKET="$SAN_PROJECT_FULL"
          REPORT_STATUS="Success"
          EXEC_LOG=""
          CREATED_ACCESS_KEY=""
          CREATED_SECRET_KEY=""
          POLICY_DETAILS=""

          case "$INPUT_ACTION" in
            create)
              if [ -z "$SAN_PROJECT" ]; then
                echo "❌ FATAL: project_name is required for 'create' action!"
                exit 1
              fi

              # Define dynamic resources for policies based on bucket access type
              BUCKET_ACCESS="${INPUT_BUCKET_ACCESS_TYPE:-project-specific}"
              RESOURCE_BUCKET=""
              RESOURCE_OBJECTS=""
              RESOURCE_OBJECT_PREFIXED=""

              case "$BUCKET_ACCESS" in
                project-specific)
                  if [ -z "$SAN_PROJECT_FULL" ]; then
                    echo "❌ FATAL: project_name is required for project-specific bucket access!"
                    exit 1
                  fi
                  RESOURCE_BUCKET="arn:aws:s3:::${BUCKET}"
                  RESOURCE_OBJECTS="arn:aws:s3:::${BUCKET}/*"
                  ;;
                project-wildcard)
                  if [ -z "$SAN_PROJECT_FULL" ]; then
                    echo "❌ FATAL: project_name is required for project-wildcard bucket access!"
                    exit 1
                  fi
                  RESOURCE_BUCKET="arn:aws:s3:::${SAN_PROJECT_FULL}*"
                  RESOURCE_OBJECTS="arn:aws:s3:::${SAN_PROJECT_FULL}*/*"
                  ;;
                all-buckets)
                  RESOURCE_BUCKET="arn:aws:s3:::*"
                  RESOURCE_OBJECTS="arn:aws:s3:::*/*"
                  ;;
                *)
                  echo "❌ FATAL: Unsupported bucket access type '$BUCKET_ACCESS'!"
                  exit 1
                  ;;
              esac

              if [ -n "$INPUT_PATH_PREFIX" ]; then
                # Sanitize path prefix (strip leading/trailing slashes)
                PREFIX=$(echo "$INPUT_PATH_PREFIX" | sed 's|^/||; s|/$||' | tr -cd 'a-zA-Z0-9-_/')
                
                case "$BUCKET_ACCESS" in
                  project-specific)
                    RESOURCE_OBJECT_PREFIXED="arn:aws:s3:::${BUCKET}/${PREFIX}/*"
                    ;;
                  project-wildcard)
                    RESOURCE_OBJECT_PREFIXED="arn:aws:s3:::${SAN_PROJECT_FULL}*/${PREFIX}/*"
                    ;;
                  all-buckets)
                    RESOURCE_OBJECT_PREFIXED="arn:aws:s3:::*/${PREFIX}/*"
                    ;;
                esac
              fi

              # If access key is explicitly provided, use it. Otherwise, auto-generate.
              if [ -n "$INPUT_ACCESS_KEY" ]; then
                CREATED_ACCESS_KEY="$INPUT_ACCESS_KEY"
                echo "  Using specified access key: $CREATED_ACCESS_KEY"
              else
                # Generate suffix if none provided
                if [ -z "$SAN_SUFFIX" ]; then
                  SAN_SUFFIX=$(openssl rand -hex 2)
                  echo "  Generated random suffix: $SAN_SUFFIX"
                fi

                # Always append a unique random 4-char hex token to avoid key name collisions
                # Format: {project}-{suffix}-{uid4}-key  (max: 8+1+4+1+4+1+3 = 22 chars)
                # We cap project at 6 chars here to stay within 20-char MinIO limit:
                # 6 + 1 + 4 + 1 + 4 + 1 + 3 = 20 chars exactly
                SAN_PROJECT6=$(echo "$SAN_PROJECT" | cut -c 1-6)
                UNIQUE_ID=$(openssl rand -hex 2)
                CREATED_ACCESS_KEY="${SAN_PROJECT6}-${SAN_SUFFIX}-${UNIQUE_ID}-key"
                echo "  Generated access key: $CREATED_ACCESS_KEY"
              fi
              CREATED_SECRET_KEY=$(openssl rand -hex 16)

              # Pre-flight: check if key already exists to give a clear error
              if "$MC_BIN" admin user svcacct info prod "$CREATED_ACCESS_KEY" > /dev/null 2>&1; then
                echo "❌ FATAL: Service account '$CREATED_ACCESS_KEY' already exists! This should not happen with unique IDs."
                exit 1
              fi

              # Compile policy file
              POLICY_FILE=$(mktemp)
              if [ -n "$INPUT_CUSTOM_POLICY_JSON" ]; then
                echo "Using custom IAM S3 Policy..."
                echo "$INPUT_CUSTOM_POLICY_JSON" > "$POLICY_FILE"
                POLICY_DETAILS="Custom S3 Policy attached."
              elif [ -n "$INPUT_PATH_PREFIX" ]; then
                echo "Generating folder-restricted S3 Policy for prefix '$PREFIX' (Scope: $BUCKET_ACCESS)..."
                printf '%s\n' \
                  '{' \
                  '  "Version": "2012-10-17",' \
                  '  "Statement": [' \
                  '    {' \
                  '      "Effect": "Allow",' \
                  '      "Action": [' \
                  '        "s3:GetBucketLocation",' \
                  '        "s3:CreateBucket"' \
                  '      ],' \
                  "      \"Resource\": [" \
                  "        \"${RESOURCE_BUCKET}\"" \
                  '      ]' \
                  '    },' \
                  '    {' \
                  '      "Effect": "Allow",' \
                  '      "Action": [' \
                  '        "s3:ListBucket"' \
                  '      ],' \
                  "      \"Resource\": [" \
                  "        \"${RESOURCE_BUCKET}\"" \
                  '      ],' \
                  '      "Condition": {' \
                  '        "StringLike": {' \
                  '          "s3:prefix": [' \
                  "            \"${PREFIX}/*\"," \
                  "            \"${PREFIX}\"" \
                  '          ]' \
                  '        }' \
                  '      }' \
                  '    },' \
                  '    {' \
                  '      "Effect": "Allow",' \
                  '      "Action": [' \
                  '        "s3:GetObject",' \
                  '        "s3:PutObject",' \
                  '        "s3:DeleteObject"' \
                  '      ],' \
                  "      \"Resource\": [" \
                  "        \"${RESOURCE_OBJECT_PREFIXED}\"" \
                  '      ]' \
                  '    }' \
                  '  ]' \
                  '}' > "$POLICY_FILE"
                POLICY_DETAILS="Folder constraint prefix: \`$PREFIX\` (Scope: \`$BUCKET_ACCESS\`)"
              else
                echo "Generating default full read-write S3 Policy (Scope: $BUCKET_ACCESS)..."
                printf '%s\n' \
                  '{' \
                  '  "Version": "2012-10-17",' \
                  '  "Statement": [' \
                  '    {' \
                  '      "Effect": "Allow",' \
                  '      "Action": [' \
                  '        "s3:ListBucket",' \
                  '        "s3:GetBucketLocation",' \
                  '        "s3:CreateBucket"' \
                  '      ],' \
                  "      \"Resource\": [" \
                  "        \"${RESOURCE_BUCKET}\"" \
                  '      ]' \
                  '    },' \
                  '    {' \
                  '      "Effect": "Allow",' \
                  '      "Action": [' \
                  '        "s3:GetObject",' \
                  '        "s3:PutObject",' \
                  '        "s3:DeleteObject"' \
                  '      ],' \
                  "      \"Resource\": [" \
                  "        \"${RESOURCE_OBJECTS}\"" \
                  '      ]' \
                  '    }' \
                  '  ]' \
                  '}' > "$POLICY_FILE"
                POLICY_DETAILS="Full Read-Write access to scope \`$RESOURCE_BUCKET\`"
              fi

              # Add service account via mc — always retries with the SAME key name.
              # On failure, services are restarted and the partial IAM entry is cleaned up
              # via mc (now healthy) before the next attempt. No dump/orphan keys are created.
              echo "Creating service account '$CREATED_ACCESS_KEY' in MinIO..."

              MAX_RETRIES=3
              ATTEMPT=0
              SVCACCT_SUCCESS=false
              CMD_OUTPUT=""
              while [ $ATTEMPT -lt $MAX_RETRIES ]; do
                ATTEMPT=$((ATTEMPT + 1))

                # From attempt 2 onwards: a previous attempt failed (partial IAM write or ghost key).
                # Restart services so MinIO is healthy, then delete any partial IAM entry for
                # the SAME key before retrying — no new key name is generated.
                if [ $ATTEMPT -gt 1 ]; then
                  echo "  ↳ Attempt $((ATTEMPT - 1)) failed. Restarting services to recover clean state..."

                  # ── Restart MinIO to recover clean state ────
                  _sudo systemctl stop minio 2>/dev/null || true
                  _sudo systemctl start minio.service 2>&1 || echo "    ⚠️ Failed to start minio"

                  # Wait for MinIO /minio/health/ready — ensures IAM backend is fully loaded
                  echo "    Waiting for MinIO /minio/health/ready (up to 30s)..."
                  WAIT=0
                  until curl -sf http://127.0.0.1:9000/minio/health/ready > /dev/null 2>&1 || [ $WAIT -ge 30 ]; do
                    sleep 3
                    WAIT=$((WAIT + 3))
                  done
                  if [ $WAIT -ge 30 ]; then
                    echo "    ❌ MinIO health/ready did not return 200 within 30s after restart!"
                    exit 1
                  fi
                  echo "    ✅ MinIO is fully ready after ${WAIT}s."

                  # Re-configure mc alias
                  ALIAS_SET=false
                  for i in {1..10}; do
                    if ALIAS_ERR=$("$MC_BIN" alias set prod http://127.0.0.1:9000 "$MINIO_USER" "$MINIO_PASS" 2>&1 < /dev/null); then
                      ALIAS_SET=true
                      break
                    fi
                    echo "    Waiting for alias configuration to succeed (attempt $i/10)..."
                    echo "    ↳ Error: $ALIAS_ERR"
                    sleep 5
                  done
                  if [ "$ALIAS_SET" = "false" ]; then
                    echo "    ❌ Failed to configure mc alias after restart."
                    exit 1
                  fi
                  echo "  ↳ Retrying with the same key name: $CREATED_ACCESS_KEY"
                fi

                # ── Clean up any partial IAM entry for the SAME key (on retry) ────
                # After restart, MinIO is healthy. If the previous attempt left a partial
                # entry, delete it now so mc svcacct add can recreate it cleanly.
                if [ $ATTEMPT -gt 1 ]; then
                  echo "  Removing partial IAM entry for '$CREATED_ACCESS_KEY' (if any)..."
                  if "$MC_BIN" admin user svcacct rm prod "$CREATED_ACCESS_KEY" > /dev/null 2>&1 < /dev/null; then
                    echo "    ✅ Partial entry removed. Will recreate '$CREATED_ACCESS_KEY' cleanly."
                  else
                    echo "    ℹ️ No partial entry found (already gone or never registered)."
                  fi
                fi

                # No pre-creation of directory is needed since we are using native ext4 local filesystem.
                # MinIO creates the directories instantly with no latency or WebDAV race conditions.

                echo "  Attempt $ATTEMPT / $MAX_RETRIES: '$CREATED_ACCESS_KEY'..."
                if CMD_OUTPUT=$("$MC_BIN" admin user svcacct add \
                  --access-key "$CREATED_ACCESS_KEY" \
                  --secret-key "$CREATED_SECRET_KEY" \
                  --policy "$POLICY_FILE" \
                  prod "$MINIO_USER" 2>&1 < /dev/null); then
                  # Post-create verification: mc svcacct add returns exit 0 even when the IAM
                  # write fails to persist through the WebDAV/FUSE backend (ghost key bug).
                  # Verify the key actually exists before declaring success.
                  echo "  Verifying key '$CREATED_ACCESS_KEY' persisted in MinIO IAM..."
                  sleep 5
                  if "$MC_BIN" admin user svcacct info prod "$CREATED_ACCESS_KEY" > /dev/null 2>&1 < /dev/null; then
                    echo "  ✅ VERIFIED: Service account persisted successfully on attempt $ATTEMPT."
                    SVCACCT_SUCCESS=true
                    break
                  else
                    CMD_OUTPUT="mc svcacct add reported success but key '$CREATED_ACCESS_KEY' NOT found in MinIO IAM (ghost write — WebDAV backend did not flush)."
                    echo "  ⚠️ Ghost key detected: $CMD_OUTPUT"
                  fi
                fi

                echo "  ⚠️ Attempt $ATTEMPT failed: $CMD_OUTPUT"
              done

              if [ "$SVCACCT_SUCCESS" != "true" ]; then
                echo "❌ ERROR: mc admin user svcacct add failed after $MAX_RETRIES attempts!"
                echo "$CMD_OUTPUT"
                rm -f "$POLICY_FILE"
                exit 1
              fi

              # Sanitize credentials (mask secret key) from execution log before showing in step summary
              EXEC_LOG=$(echo "$CMD_OUTPUT" | sed -E 's/(Secret Key\s*:\s*)[a-zA-Z0-9]+/\1***** (download artifact below)/i')
              rm -f "$POLICY_FILE"

              # Write credentials to a temp file for one-time artifact upload
              CREDS_FILE="/tmp/minio-creds-${GITHUB_RUN_ID}.txt"
              printf '%s\n' \
                "MinIO Service Account Credentials" \
                "===================================" \
                "" \
                "  Access Key : $CREATED_ACCESS_KEY" \
                "  Secret Key : $CREATED_SECRET_KEY" \
                "" \
                "  Project    : $SAN_PROJECT_FULL" \
                "  Bucket     : $BUCKET" \
                "  Policy     : $POLICY_DETAILS" \
                "" \
                "  Generated  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
                "" \
                "⚠️  IMPORTANT: Download this file immediately." \
                "   This artifact will be auto-deleted after 1 minute." \
                "   Never commit these credentials to version control." \
                > "$CREDS_FILE"
              # Export file path for artifact upload step
              echo "creds_file=$CREDS_FILE" >> "$GITHUB_OUTPUT"

              # Format for report
              echo "  ✅ Service Account '$CREATED_ACCESS_KEY' created successfully!"
              ;;

            read)
              if [ -n "$INPUT_ACCESS_KEY" ]; then
                echo "Fetching details for specific service account: $INPUT_ACCESS_KEY"
                if ! CMD_OUTPUT=$("$MC_BIN" admin user svcacct info prod "$INPUT_ACCESS_KEY" 2>&1 < /dev/null); then
                  echo "❌ ERROR: mc admin user svcacct info failed!"
                  echo "$CMD_OUTPUT"
                  exit 1
                fi
                
                # Fetch policy JSON if available
                POLICY_OUTPUT=""
                if POLICY_OUTPUT=$("$MC_BIN" admin user svcacct info prod "$INPUT_ACCESS_KEY" --policy 2>&1 < /dev/null); then
                  EXEC_LOG="$CMD_OUTPUT"$'\n\n'"--- Policy JSON ---"$'\n'"$POLICY_OUTPUT"
                else
                  EXEC_LOG="$CMD_OUTPUT"
                fi
                
                echo "$CMD_OUTPUT"
                if [ -n "$POLICY_OUTPUT" ]; then
                  echo ""
                  echo "--- Policy JSON ---"
                  echo "$POLICY_OUTPUT"
                fi
              else
                echo "Listing all service accounts for root user '$MINIO_USER'..."
                if ! ALL_KEYS=$("$MC_BIN" admin user svcacct ls prod "$MINIO_USER" 2>&1 < /dev/null); then
                  echo "❌ ERROR: mc admin user svcacct ls failed!"
                  echo "$ALL_KEYS"
                  exit 1
                fi
                
                if [ -n "$SAN_PROJECT" ]; then
                  echo "Filtering credentials matching project prefix: '$SAN_PROJECT-'"
                  FILTERED_KEYS=$(echo "$ALL_KEYS" | grep "^${SAN_PROJECT}-" || echo "No service accounts found matching: ${SAN_PROJECT}-*")
                  EXEC_LOG="$FILTERED_KEYS"
                  echo "$FILTERED_KEYS"
                else
                  EXEC_LOG="$ALL_KEYS"
                  echo "$ALL_KEYS"
                fi
              fi
              ;;

            delete)
              if [ -z "$INPUT_ACCESS_KEY" ]; then
                echo "❌ FATAL: access_key is required for 'delete' action!"
                exit 1
              fi

              echo "Removing service account '$INPUT_ACCESS_KEY' from MinIO..."
              if ! CMD_OUTPUT=$("$MC_BIN" admin user svcacct rm prod "$INPUT_ACCESS_KEY" 2>&1 < /dev/null); then
                if echo "$CMD_OUTPUT" | grep -q -i -E "not found|does not exist"; then
                  echo "  ⚠️ Service Account '$INPUT_ACCESS_KEY' was not found (already deleted or never existed). Continuing."
                  CMD_OUTPUT="Service Account '$INPUT_ACCESS_KEY' not found (already deleted)."
                else
                  echo "❌ ERROR: mc admin user svcacct rm failed!"
                  echo "$CMD_OUTPUT"
                  exit 1
                fi
              fi
              EXEC_LOG="$CMD_OUTPUT"
              echo "$CMD_OUTPUT"
              echo "  ✅ Service Account '$INPUT_ACCESS_KEY' removed successfully!"
              ;;

            *)
              echo "❌ FATAL: Unsupported action '$INPUT_ACTION'!"
              exit 1
              ;;
          esac

          # ── Compile Markdown Step Summary ────────────────────────────────────
          echo "===> [4/4] Generating workflow run step summary..."
          {
            echo "# MinIO S3 Credentials Administration Report"
            echo ""
            echo "### Operation Status: ${REPORT_STATUS}"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| **Requested Action** | \`$INPUT_ACTION\` |"
            if [ -n "$SAN_PROJECT_FULL" ]; then
              echo "| **Project Name** | \`$SAN_PROJECT_FULL\` |"
              echo "| **Target S3 Bucket** | \`$BUCKET\` |"
            fi
            if [ "$INPUT_ACTION" = "create" ]; then
              echo "| **Bucket Access Scope** | \`$BUCKET_ACCESS\` |"
              echo "| **Generated Access Key** | \`$CREATED_ACCESS_KEY\` |"
              echo "| **Generated Secret Key** | *(see one-time downloadable artifact below)* |"
              echo "| **S3 Policy Type** | $POLICY_DETAILS |"
              echo "| **Attempts Required** | $ATTEMPT of $MAX_RETRIES |"
              echo ""
              echo "> [!CAUTION]"
              echo "> The **Secret Key is NOT shown here** for security. It is only available in the downloadable artifact."
              echo "> The artifact will be **auto-deleted after 1 minute**. Download it immediately."
              if [ "$ATTEMPT" -gt 1 ]; then
                echo ""
                echo "> [!NOTE]"
                echo "> Creation required **$ATTEMPT attempts** due to transient WebDAV/FUSE write errors."
                echo "> Partial IAM entries from earlier attempts were automatically cleaned up."
              fi
            fi
            if [ "$INPUT_ACTION" = "delete" ]; then
              echo "| **Deleted Access Key** | \`$INPUT_ACCESS_KEY\` |"
            fi
            echo ""
            echo "### Execution Log & Outputs"
            echo "\`\`\`text"
            echo "$EXEC_LOG"
            echo "\`\`\`"
            echo "---"
            echo "*MinIO credentials managed securely by self-hosted runner on the production host.*"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── One-Time Credential Artifact Upload ──────────────────────────────────
      - name: Upload Credentials as One-Time Artifact
        id: upload-creds
        if: github.event.inputs.action == 'create' && steps.manage.outputs.creds_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: minio-credentials-${{ github.run_id }}
          path: ${{ steps.manage.outputs.creds_file }}
          retention-days: 1

      - name: Append Artifact Download Info to Step Summary
        if: github.event.inputs.action == 'create' && steps.upload-creds.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload-creds.outputs.artifact-id }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo ""
            echo "---"
            echo "## 🔐 One-Time Credential Download"
            echo ""
            echo "> [!CAUTION]"
            echo "> **This artifact will be auto-deleted in ~1 minute.** Download it now and store the Secret Key securely."
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Artifact ID** | \`${ARTIFACT_ID}\` |"
            echo "| **Artifact Name** | \`minio-credentials-${RUN_ID}\` |"
            echo "| **Auto-Delete** | ~1 minute from now |"
            echo ""
            echo "📥 **[Click here to download](https://github.com/${REPO}/actions/runs/${RUN_ID})** — scroll to the **Artifacts** section at the bottom of the run page."
            echo ""
            echo "💡 *Note: The artifact will automatically be deleted in 1 minute. You do not need to manually delete it.*"
            echo "However, if you wish to delete it immediately after downloading, you can run:"
            echo "\`\`\`bash"
            echo "curl -s -X DELETE -H \"Authorization: Bearer \${GH_TOKEN}\" https://api.github.com/repos/${REPO}/actions/artifacts/\${ARTIFACT_ID}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Credentials Temp File from Runner
        if: always() && github.event.inputs.action == 'create'
        run: rm -f "${{ steps.manage.outputs.creds_file }}"

  # ═══════════════════════════════════════════════════════════════════════════════
  # Auto-Delete Credential Artifact — runs in parallel, deletes after 1 minute
  # ═══════════════════════════════════════════════════════════════════════════════
  cleanup_artifact:
    name: Auto-Delete Credential Artifact
    needs: manage_credentials
    if: needs.manage_credentials.outputs.credential_artifact_id != ''
    runs-on: [self-hosted, linux, x64, production]
    permissions:
      actions: write
    steps:
      - name: Wait 1 min then delete artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.manage_credentials.outputs.credential_artifact_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "⏳ Credential artifact [${ARTIFACT_ID}] will be auto-deleted in 1 minute..."
          echo "   Operators should download the artifact before that time."
          sleep 60
          echo "🗑️  Deleting artifact ${ARTIFACT_ID}..."
          if curl -s -f -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/artifacts/${ARTIFACT_ID}" 2>&1; then
            echo "✅ Credential artifact deleted successfully."
          else
            echo "⚠️  Artifact may have already been manually deleted or failed to delete. Continuing."
          fi
